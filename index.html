<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الدفع | Z Point</title>
    <!-- استدعاء خط Cairo للغة العربية -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* إعدادات عامة */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #121212; /* خلفية داكنة وأنيقة */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* الحاوية الرئيسية */
        .container {
            background-color: #1e1e1e;
            border-radius: 20px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            border: 1px solid #333;
        }

        /* منطقة الهيدر والاسم */
        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
            color: #f3f3f3;
        }

        .header p {
            color: #aaaaaa;
            font-size: 14px;
        }

        /* عرض درجة الحرارة */
        .temp-display {
            background-color: #2a2a2a;
            display: inline-block;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 14px;
            margin-top: 10px;
            color: #00d2ff;
            border: 1px solid #00d2ff;
        }

        /* تنسيق الأزرار */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
            color: #ffffff;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-instapay {
            background: linear-gradient(135deg, #6c1b73, #43114a); /* ألوان قريبة من إنستا باي */
            box-shadow: 0 4px 15px rgba(108, 27, 115, 0.4);
        }

        .btn-vfcash {
            background: linear-gradient(135deg, #e60000, #990000); /* ألوان فودافون */
            box-shadow: 0 4px 15px rgba(230, 0, 0, 0.4);
        }

        .btn .icon {
            margin-left: 10px;
            font-size: 20px;
        }

        /* نافذة الإشعار المنبثقة (Toast) */
        .toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #4CAF50;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 12px;
            position: fixed;
            z-index: 1;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 15px;
            opacity: 0;
            transition: opacity 0.3s, visibility 0.3s;
        }

        .toast.show {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1 id="uiBrandName">الاسم</h1>
            <p id="uiDescription">اختر طريقة الدفع المناسبة لك</p>
            <!-- قسم درجة الحرارة -->
            <div id="uiTemp" class="temp-display" style="display: none;">
                درجة الحرارة: <span id="tempValue"></span>
            </div>
        </div>

        <div class="buttons">
            <button id="btnInstapay" class="btn btn-instapay">
                <span class="icon">🔗</span> الدفع عبر إنستا باي
            </button>
            <button id="btnVfcash" class="btn btn-vfcash">
                <span class="icon">📱</span> نسخ رقم فودافون كاش
            </button>
        </div>
    </div>

    <!-- إشعار النسخ -->
    <div id="toast" class="toast">تم نسخ الرقم بنجاح!</div>

    <script>
        /* =========================================
           منطقة الإعدادات - عدل بياناتك هنا فقط
        ========================================= */
        const CONFIG = {
            brandName: "Z Point", // اسم المتجر أو صفحتك
            description: "اختر طريقة الدفع المناسبة لك", // الوصف أسفل الاسم
            
            // روابط الدفع والأرقام
            instapayLink: "https://instapay.eg/your-link", // ضع رابط إنستا باي الخاص بك هنا
            vfcashNumber: "01000000000", // ضع رقم فودافون كاش هنا
            
            // إعدادات درجة الحرارة (أو أي قيمة رقمية أخرى)
            showTemperature: true, // اجعلها false إذا أردت إخفاء قسم درجة الحرارة
            temperatureValue: "24°C" // القيمة التي ستظهر (يمكنك تحديثها برمجياً لاحقاً)
        };
        /* ========================================= */

        // 1. تطبيق الإعدادات على واجهة المستخدم (DOM)
        document.getElementById('uiBrandName').textContent = CONFIG.brandName;
        document.getElementById('uiDescription').textContent = CONFIG.description;
        
        // معالجة عرض درجة الحرارة
        if (CONFIG.showTemperature) {
            document.getElementById('uiTemp').style.display = 'inline-block';
            document.getElementById('tempValue').textContent = CONFIG.temperatureValue;
        }

        // 2. تفعيل زر إنستا باي (تحويل مباشر)
        document.getElementById('btnInstapay').addEventListener('click', () => {
            if (CONFIG.instapayLink && CONFIG.instapayLink !== "") {
                window.location.href = CONFIG.instapayLink;
            } else {
                alert("لم يتم تعيين رابط إنستا باي في الكود.");
            }
        });

        // 3. تفعيل زر فودافون كاش (نسخ الرقم للحافظة)
        document.getElementById('btnVfcash').addEventListener('click', () => {
            // استخدام واجهة Clipboard API الحديثة (تعمل بشكل مثالي على GitHub Pages لأنها تدعم HTTPS)
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(CONFIG.vfcashNumber).then(() => {
                    showToast();
                }).catch(err => {
                    console.error("فشل النسخ: ", err);
                    fallbackCopyText(CONFIG.vfcashNumber);
                });
            } else {
                // طريقة بديلة للمتصفحات القديمة
                fallbackCopyText(CONFIG.vfcashNumber);
            }
        });

        // دالة بديلة لنسخ النص إذا فشلت الطريقة الحديثة
        function fallbackCopyText(text) {
            const tempInput = document.createElement("input");
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            tempInput.setSelectionRange(0, 99999); // للهواتف المحمولة
            try {
                document.execCommand("copy");
                showToast();
            } catch (err) {
                console.error("فشل النسخ بالطريقة البديلة", err);
                alert("فشل النسخ التلقائي. الرقم هو: " + text);
            }
            document.body.removeChild(tempInput);
        }

        // 4. إظهار إشعار بنجاح النسخ
        function showToast() {
            const toast = document.getElementById("toast");
            toast.className = "toast show";
            // إخفاء الإشعار بعد 3 ثوانٍ
            setTimeout(() => {
                toast.className = toast.className.replace("show", "");
            }, 3000);
        }
    </script>
</body>
</html>
