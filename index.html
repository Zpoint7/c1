<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Z Point</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;
    background:#0f172a;color:#fff;
    display:flex;align-items:center;justify-content:center;
    padding:24px;min-height:100vh;min-height:100dvh;
  }
  .card{
    background:#1e293b;border-radius:20px;padding:32px 24px;
    text-align:center;max-width:380px;width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
  }
  .icon{font-size:56px;margin-bottom:16px}
  h1{font-size:20px;margin-bottom:12px;font-weight:700}
  p{font-size:15px;color:#94a3b8;line-height:1.7;margin-bottom:24px}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;padding:16px;border-radius:14px;font-size:17px;
    font-weight:700;border:none;cursor:pointer;text-decoration:none;
    color:#fff;transition:transform .15s,opacity .15s;
  }
  .btn:active{transform:scale(.97)}
  .btn-wa{background:#25D366}
  .btn-copy{background:#22c55e}
  .brand{margin-top:22px;font-size:13px;color:#64748b}
  .brand b{color:#38bdf8}
  .wa-svg{width:22px;height:22px;fill:currentColor}
</style>
</head>
<body>

<script>
/* ============================================================
   ==============  الإعدادات (عدّل هنا فقط)  =================
   ============================================================
   • ضع اللينك جوه علامات التنصيص، واتركه فارغ "" لو لسه مفيش.
   • ضع الرقم جوه علامات التنصيص، واتركه فارغ "" لو مفيش رقم.
   ------------------------------------------------------------
   أمثلة:
     انستا باي / لينك دفع عادي:  PAYMENT_LINK = "https://..."
     فودافون كاش:                PAYMENT_LINK = "https://..."
                                 PHONE_NUMBER = "01012345678"
     صفحة سوشيال ميديا:          PAYMENT_LINK = "https://..."
     كارت لسه فاضي:              PAYMENT_LINK = ""
                                 PHONE_NUMBER = ""
   ============================================================ */

const PAYMENT_LINK = "";   // ← حط اللينك هنا
const PHONE_NUMBER = "";   // ← حط الرقم هنا (لو فودافون كاش)

/* ============================================================
   ============  لا تعدل أي شيء بعد هذا السطر  ===============
   ============================================================ */

const SUPPORT_PHONE = "01032868412";  // رقم الدعم (يظهر في صفحة الانتظار)
const SUPPORT_WA    = "201032868412"; // نفس الرقم بصيغة دولية

/* ---------- أدوات مساعدة ---------- */
function normalizePhone(p){
  if(!p) return "";
  return String(p).trim()
    .replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d))
    .replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d))
    .replace(/[^\d+]/g, "");
}

function fallbackCopy(text){
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly','');
    ta.style.position='fixed';
    ta.style.top='-9999px';
    ta.style.opacity='0';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}

function tryAutoCopy(text){
  return new Promise(resolve => {
    // أولاً نحاول بالطريقة الحديثة
    if(navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(text)
        .then(()=>resolve(true))
        .catch(()=>resolve(fallbackCopy(text)));
    } else {
      resolve(fallbackCopy(text));
    }
  });
}

/* ---------- الشاشات ---------- */
function renderCopyScreen(url, num){
  document.body.innerHTML = `
    <div class="card">
      <div class="icon">📋</div>
      <h1>اضغط الزر ثم تابع الدفع</h1>
      <p>سيتم نسخ رقم الدفع تلقائياً،<br>وبعدها هيتم تحويلك لصفحة الدفع مباشرة.</p>
      <button class="btn btn-copy" id="goBtn">نسخ الرقم والانتقال للدفع</button>
      <div class="brand">صنع بواسطة <b>Z Point</b></div>
    </div>`;

  document.getElementById('goBtn').addEventListener('click', function(){
    this.disabled = true;
    this.style.opacity = '.7';

    // نسخ متزامن (مهم جداً للآيفون مع لمسة المستخدم)
    let ok = false;
    try { ok = fallbackCopy(num); } catch(e){}

    // محاولة إضافية بالـ Clipboard API
    try{
      if(navigator.clipboard) navigator.clipboard.writeText(num).catch(()=>{});
    }catch(e){}

    // تحويل سريع بعد النسخ
    setTimeout(()=>{ window.location.href = url; }, 120);
  });
}

function renderEmpty(){
  document.body.innerHTML = `
    <div class="card">
      <div class="icon">💳</div>
      <h1>لم يتم إضافة لينك بعد</h1>
      <p>هذا الكارت لم يتم تفعيله بعد.<br>للتفعيل أو الاستفسار تواصل معنا.</p>
      <a class="btn btn-wa" href="https://wa.me/${SUPPORT_WA}" target="_blank" rel="noopener">
        <svg class="wa-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
        </svg>
        <span>تواصل واتساب: ${SUPPORT_PHONE}</span>
      </a>
      <div class="brand">صنع بواسطة <b>Z Point</b></div>
    </div>`;
}

/* ---------- التشغيل ---------- */
(function main(){
  const link  = (PAYMENT_LINK || "").trim();
  const phone = normalizePhone(PHONE_NUMBER);

  // 1) مفيش لينك → صفحة الترحيب
  if(!link){ renderEmpty(); return; }

  // 2) لينك بس (انستا باي / سوشيال ميديا / لينك دفع عادي) → تحويل مباشر
  if(!phone){ window.location.replace(link); return; }

  // 3) لينك + رقم (فودافون كاش) → نحاول نسخ تلقائي
  tryAutoCopy(phone).then(ok => {
    if(ok){
      window.location.replace(link);
    } else {
      renderCopyScreen(link, phone);
    }
  });
})();
</script>
</body>
</html>
